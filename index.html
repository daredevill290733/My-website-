<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rajniti Rewrite | রাজনীতি রিরাইট</title>
<meta name="description" content="Rajniti Rewrite — বাংলাদেশ ও বিশ্বের রাজনীতি, অর্থনীতি, খেলা ও প্রযুক্তির সর্বশেষ খবর ও বিশ্লেষণ। প্রগতির নতুন বয়ান।">
<meta name="theme-color" content="#0b1f3a">
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#14171c;--muted:#656d79;--line:#e1e4e8;--brand:#c8102e;--navy:#0b1f3a;--head:#fff;--inp:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--card:#171a20;--text:#eef0f3;--muted:#9aa3b0;--line:#2a2f38;--head:#12151a;--inp:#0d0f13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f13;--card:#171a20;--text:#eef0f3;--muted:#9aa3b0;--line:#2a2f38;--head:#12151a;--inp:#0d0f13;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","Segoe UI",sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header{background:var(--head);border-bottom:1px solid var(--line)}
.topline{background:var(--navy);color:#cfd8e6;font-size:12px}
.topline .wrap{display:flex;justify-content:space-between;padding:6px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand svg{flex:none}
.wm{font-family:Georgia,serif;font-weight:700;font-size:28px;letter-spacing:1.5px;line-height:1}
.wm b{color:var(--brand)}
.tg{display:block;color:var(--muted);font-size:12px;letter-spacing:.3px;margin-top:4px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
nav{background:var(--navy)}
nav .wrap{display:flex;overflow-x:auto}
nav button{background:none;border:0;color:#dfe6f0;font-weight:600;font-size:15px;padding:12px 15px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on,nav button:hover{color:#fff;border-bottom-color:var(--brand)}
.ticker{background:var(--card);border-bottom:1px solid var(--line);font-size:14px}
.ticker .wrap{display:flex;gap:12px;align-items:center;padding:8px 16px}
.ticker b{background:var(--brand);color:#fff;padding:1px 10px;border-radius:3px;font-size:12px;white-space:nowrap}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:22px 0 44px;min-height:60vh}
.lead{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:block}
.pic{aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),#1b3a66);display:grid;place-items:center;color:#ffffff55;font:700 54px Georgia,serif}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pad{padding:14px 16px 16px}
.tag{color:var(--brand);font-weight:700;font-size:13px}
.meta{color:var(--muted);font-size:12px}
.big h2{font-size:28px;line-height:1.35;margin:6px 0 8px}
.big p{color:var(--muted);margin:0 0 10px}
.side{display:flex;flex-direction:column;gap:14px}
.side .card{display:grid;grid-template-columns:120px 1fr}
.side .pic{aspect-ratio:auto;height:100%;font-size:30px}
.side h3{font-size:15px;line-height:1.4;margin:3px 0}
h2.sec{font-size:21px;border-left:5px solid var(--brand);padding-left:10px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid h3{font-size:17px;line-height:1.45;margin:4px 0 6px}
.grid p{font-size:14px;color:var(--muted);margin:0 0 8px}
.card:hover h2,.card:hover h3{color:var(--brand)}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.art{max-width:800px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.art h1{font-size:30px;line-height:1.35;margin:6px 0 10px}
.art .sum{font-size:18px;color:var(--muted);border-left:4px solid var(--brand);padding-left:12px;margin:12px 0}
.art .body p{font-size:18px;line-height:1.9;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#adm{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:20px 12px}
#adm.on{display:flex}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;width:100%;max-width:720px;padding:20px}
.panel label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;background:var(--inp);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}
.panel textarea{min-height:180px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.msg{font-size:13px;color:var(--muted);margin-top:10px}
footer{background:var(--navy);color:#b9c5d6;padding:26px 0;text-align:center;font-size:13px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-bottom:12px}
.flinks a{color:#dfe6f0;font-weight:600}.flinks a:hover{color:#fff;text-decoration:underline}
.ad{display:block;border:1px dashed var(--line);background:var(--card);color:var(--muted);text-align:center;padding:20px 12px;border-radius:8px;margin:0 0 28px;font-size:14px}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);margin-top:18px;padding-top:14px;font-size:14px}
@media(max-width:760px){.lead{grid-template-columns:1fr}.big h2{font-size:22px}.art h1{font-size:24px}.wm{font-size:20px}.topline .wrap span:last-child{display:none}.side .card{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<header>
  <div class="topline"><div class="wrap"><span id="date"></span><span>সত্য • নিরপেক্ষ • সময়োপযোগী</span></div></div>
  <div class="wrap top">
    <div class="brand" id="home" title="প্রচ্ছদ">
      <svg width="52" height="52" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="10" fill="#0b1f3a"/><polygon points="0,40 48,28 48,34 0,46" fill="#c8102e"/><text x="24" y="28" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="27" fill="#fff">R</text></svg>
      <div><div class="wm">RAJNITI <b>REWRITE</b></div><span class="tg">রাজনীতি রিরাইট • প্রগতির নতুন বয়ান</span></div>
    </div>
    <div id="own"></div>
  </div>
  <nav><div class="wrap" id="tabs"></div></nav>
</header>
<div class="ticker"><div class="wrap"><b>সর্বশেষ</b><span id="tick">খবর লোড হচ্ছে...</span></div></div>
<main class="wrap" id="app"></main>
<footer>
  <div class="wrap">
    <div class="flinks"><a href="#about">আমাদের সম্পর্কে</a><a href="#contact">যোগাযোগ</a><a href="#advertise">বিজ্ঞাপন দিন</a><a href="#policy">সম্পাদকীয় নীতি</a><a href="#privacy">গোপনীয়তা নীতি</a></div>
    <strong>Rajniti Rewrite</strong> — প্রগতির নতুন বয়ান<br>© ২০২৬ Rajniti Rewrite. সর্বস্বত্ব সংরক্ষিত।
  </div>
</footer>
<div id="adm"></div>

<script type="application/json" id="posts-data">[]</script>

<script>
var CATS=['বাংলাদেশ','বিশ্ব','রাজনীতি','অর্থনীতি','খেলা','প্রযুক্তি','বিনোদন','মতামত'];

// Keyword base auto categorizer
var KW={
  'বাংলাদেশ':/বাংলাদেশ|ঢাকা|চট্টগ্রাম|সিলেট|রাজশাহী|খুলনা|বরিশাল|রংপুর|ময়মনসিংহ|দেশ/i,
  'রাজনীতি':/রাজনীতি|নির্বাচন|সরকার|বিএনপি|আওয়ামী|দল|সংসদ|উপদেষ্টা|মন্ত্রী/i,
  'অর্থনীতি':/অর্থনীতি|ব্যাংক|বাণিজ্য|টাকা|ডলার|বাজার|শেয়ার|শেয়ারবাজার|মুদ্রাস্ফীতি/i,
  'খেলা':/খেলা|ক্রিকেট|ফুটবল|মেসি|রোনালদো|সাকিব|বাংলাদেশ ক্রিকেট|টি-টোয়েন্টি/i,
  'প্রযুক্তি':/প্রযুক্তি|এআই|স্মার্টফোন|ফেসবুক|গুগল|ইন্টারনেট|সাইবার/i,
  'বিনোদন':/বিনোদন|সিনেমা|চলচ্চিত্র|নাটক|গান|নায়ক|নায়িকা|বলিউড|ঢালিউড/i,
  'মতামত':/মতামত|কলাম|বিশ্লেষণ|সম্পাদকীয়/i
};

// Default news feeds
var RSS_FEEDS=[
  'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.bbci.co.uk%2Fbengali%2Frss.xml',
  'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.prothomalo.com%2Ffeed'
];

var posts = [];
try { posts = JSON.parse(document.getElementById('posts-data').textContent) || []; } catch(e){}

var autoPosts = [];
try { autoPosts = JSON.parse(localStorage.getItem('rr-auto-posts') || '[]'); } catch(e){}

var cur = '';
var $=function(i){return document.getElementById(i)};

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmt(ts){try{return new Date(ts).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}}

function detectCat(text){
  for(var k in KW){
    if(KW[k].test(text)) return k;
  }
  return 'বিশ্ব';
}

$('date').textContent = new Date().toLocaleDateString('bn-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function tabs(){
  $('tabs').innerHTML = ['প্রচ্ছদ'].concat(CATS).map(function(c,i){
    var v = i ? c : '';
    return '<button data-c="'+esc(v)+'" class="'+(v===cur?'on':'')+'">'+esc(c)+'</button>';
  }).join('');
}

$('tabs').onclick = function(e){
  var b = e.target.closest('button');
  if(!b) return;
  cur = b.dataset.c;
  location.hash = '';
  tabs();
  render();
};

$('home').onclick = function(){
  cur = '';
  location.hash = '';
  tabs();
  render();
};

function pic(p){
  return '<div class="pic">'+(p.img ? '<img src="'+esc(p.img)+'" alt="" loading="lazy">' : 'R')+'</div>';
}

function lk(p){
  return p.url ? 'href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer"' : 'href="#'+p.id+'"';
}

function card(p, k){
  if(k === 'side'){
    return '<a class="card" '+lk(p)+'>'+pic(p)+'<div class="pad"><span class="tag">'+esc(p.cat)+'</span><h3>'+esc(p.title)+'</h3><span class="meta">'+(p.src?'সূত্র: '+esc(p.src)+' • ':'')+fmt(p.ts)+'</span></div></a>';
  }
  return '<a class="card" '+lk(p)+'>'+pic(p)+'<div class="pad"><span class="tag">'+esc(p.cat)+'</span><h3>'+esc(p.title)+'</h3><p>'+esc((p.sum||'').slice(0,110))+'...</p><span class="meta">'+(p.src?'সূত্র: '+esc(p.src)+' • ':'')+fmt(p.ts)+'</span></div></a>';
}

function getAllPosts(){
  var all = posts.concat(autoPosts);
  all.sort(function(a,b){return b.ts - a.ts});
  return all;
}

function render(){
  var all = getAllPosts();
  var id = location.hash.slice(1);
  var p = id && all.find(function(x){return x.id === id});

  window.scrollTo(0,0);

  $('tick').textContent = all.length ? all.slice(0,5).map(function(x){return x.title}).join('   •   ') : 'সবশেষ খবরের জন্য অপেক্ষা করুন...';

  if(p){
    document.title = p.title + ' | Rajniti Rewrite';
    $('app').innerHTML = '<article class="art"><div class="bar"><button class="btn alt sm" id="back">← প্রচ্ছদ</button></div><span class="tag">'+esc(p.cat)+'</span><h1>'+esc(p.title)+'</h1><div class="meta">'+esc(p.by||'Rajniti Rewrite')+ ' • '+fmt(p.ts)+'</div>'+(p.sum?'<div class="sum">'+esc(p.sum)+'</div>':'')+'<div class="body">'+String(p.body||p.sum||'').split(/\n+/).map(function(t){return '<p>'+esc(t)+'</p>'}).join('')+'</div></article>';
    $('back').onclick = function(){location.hash = '';};
    return;
  }

  var list = cur ? all.filter(function(x){return x.cat === cur}) : all;

  if(!list.length){
    $('app').innerHTML = '<div class="empty"><h2>"'+esc(cur||'প্রচ্ছদ')+'" বিভাগে কোনো খবর পাওয়া যায়নি</h2><p>শীঘ্রই খবর আপডেট হবে।</p></div>';
    return;
  }

  var l = list[0], s = list.slice(1,4), g = list.slice(4);
  $('app').innerHTML = '<section class="lead"><a class="card big" '+lk(l)+'>'+pic(l)+'<div class="pad"><span class="tag">'+esc(l.cat)+'</span><h2>'+esc(l.title)+'</h2><p>'+esc(l.sum||'')+'</p><span class="meta">'+(l.src?'সূত্র: '+esc(l.src)+' • ':'')+fmt(l.ts)+'</span></div></a><div class="side">'+s.map(function(x){return card(x,'side')}).join('')+'</div></section>' + (g.length ? '<h2 class="sec">আরও খবর</h2><section class="grid">'+g.map(function(x){return card(x)}).join('')+'</section>' : '');
}

function fetchAutoNews(){
  RSS_FEEDS.forEach(function(feedUrl){
    fetch(feedUrl)
      .then(function(res){return res.json()})
      .then(function(data){
        if(data && data.items){
          var fetched = data.items.map(function(item, idx){
            var title = item.title ? item.title.trim() : '';
            var desc = item.description ? item.description.replace(/<[^>]*>/g, '').trim() : '';
            var cat = detectCat(title + ' ' + desc);
            return {
              id: 'rss_' + String(item.guid || item.link).replace(/[^a-zA-Z0-9]/g, ''),
              title: title,
              sum: desc.slice(0, 180),
              url: item.link,
              src: data.feed ? data.feed.title : 'অনলাইন',
              cat: cat,
              img: item.thumbnail || (item.enclosure ? item.enclosure.link : ''),
              ts: item.pubDate ? new Date(item.pubDate).getTime() : Date.now()
            };
          }).filter(function(x){return x.title});

          if(fetched.length){
            var existingIds = {};
            autoPosts.forEach(function(x){existingIds[x.id]=true});
            fetched.forEach(function(x){
              if(!existingIds[x.id]){
                autoPosts.push(x);
              }
            });
            autoPosts.sort(function(a,b){return b.ts - a.ts});
            autoPosts = autoPosts.slice(0, 80);
            try{ localStorage.setItem('rr-auto-posts', JSON.stringify(autoPosts)); }catch(e){}
            render();
          }
        }
      }).catch(function(err){ console.log('Feed load error:', err); });
  });
}

window.onhashchange = render;

tabs();
render();
fetchAutoNews();
setInterval(fetchAutoNews, 300000);
</script>
</body>
</html>
