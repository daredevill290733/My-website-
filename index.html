<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rajniti Rewrite | রাজনীতি রিরাইট</title>
<meta name="description" content="Rajniti Rewrite — বাংলাদেশ ও বিশ্বের রাজনীতি, অর্থনীতি, খেলা ও প্রযুক্তির সর্বশেষ খবর ও বিশ্লেষণ। প্রগতির নতুন বয়ান।">
<meta name="theme-color" content="#0b1f3a">
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#14171c;--muted:#656d79;--line:#e1e4e8;--brand:#c8102e;--navy:#0b1f3a;--head:#fff;--inp:#fff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--card:#171a20;--text:#eef0f3;--muted:#9aa3b0;--line:#2a2f38;--head:#12151a;--inp:#0d0f13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f13;--card:#171a20;--text:#eef0f3;--muted:#9aa3b0;--line:#2a2f38;--head:#12151a;--inp:#0d0f13;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Bengali","Nirmala UI","Kalpurush","Segoe UI",sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header{background:var(--head);border-bottom:1px solid var(--line)}
.topline{background:var(--navy);color:#cfd8e6;font-size:12px}
.topline .wrap{display:flex;justify-content:space-between;padding:6px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand svg{flex:none}
.wm{font-family:Georgia,serif;font-weight:700;font-size:28px;letter-spacing:1.5px;line-height:1}
.wm b{color:var(--brand)}
.tg{display:block;color:var(--muted);font-size:12px;letter-spacing:.3px;margin-top:4px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
nav{background:var(--navy)}
nav .wrap{display:flex;overflow-x:auto}
nav button{background:none;border:0;color:#dfe6f0;font-weight:600;font-size:15px;padding:12px 15px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on,nav button:hover{color:#fff;border-bottom-color:var(--brand)}
.ticker{background:var(--card);border-bottom:1px solid var(--line);font-size:14px}
.ticker .wrap{display:flex;gap:12px;align-items:center;padding:8px 16px}
.ticker b{background:var(--brand);color:#fff;padding:1px 10px;border-radius:3px;font-size:12px;white-space:nowrap}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:22px 0 44px;min-height:60vh}
.lead{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:block;transition:transform 0.2s}
.card:hover{transform:translateY(-2px)}
.pic{aspect-ratio:16/9;background:#1b3a66;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:bold;font-size:24px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pad{padding:14px 16px 16px}
.tag{color:var(--brand);font-weight:700;font-size:13px}
.meta{color:var(--muted);font-size:12px;margin-top:6px;display:block}
.big h2{font-size:28px;line-height:1.35;margin:6px 0 8px}
.big p{color:var(--muted);margin:0 0 10px}
.side{display:flex;flex-direction:column;gap:14px}
.side .card{display:grid;grid-template-columns:120px 1fr}
.side .pic{aspect-ratio:auto;height:100%}
.side h3{font-size:15px;line-height:1.4;margin:3px 0}
h2.sec{font-size:21px;border-left:5px solid var(--brand);padding-left:10px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid h3{font-size:17px;line-height:1.45;margin:4px 0 6px}
.grid p{font-size:14px;color:var(--muted);margin:0 0 8px}
.card:hover h2,.card:hover h3{color:var(--brand)}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.art{max-width:800px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.art h1{font-size:30px;line-height:1.35;margin:10px 0}
.art .main-img{width:100%;max-height:420px;object-fit:cover;border-radius:6px;margin:12px 0}
.art .sum{font-size:18px;color:var(--muted);border-left:4px solid var(--brand);padding-left:12px;margin:16px 0;font-weight:500}
.art .body p{font-size:18px;line-height:1.8;margin:0 0 16px;color:var(--text)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* অ্যাডমিন প্যানেলের পপ-আপ স্টাইল */
#adm{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;overflow:auto;z-index:100;padding:20px 12px}
#adm.on{display:flex}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;width:100%;max-width:650px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,0.3)}
.panel h2{margin:0 0 16px;font-size:22px}
.panel label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;background:var(--inp);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}
.panel textarea{min-height:160px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.prev-img{max-width:150px;max-height:100px;border-radius:6px;margin-top:8px;object-fit:cover;display:block}

footer{background:var(--navy);color:#b9c5d6;padding:26px 0;text-align:center;font-size:13px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-bottom:12px}
.flinks a{color:#dfe6f0;font-weight:600}.flinks a:hover{color:#fff;text-decoration:underline}
@media(max-width:760px){.lead{grid-template-columns:1fr}.big h2{font-size:22px}.art h1{font-size:24px}.wm{font-size:20px}.topline .wrap span:last-child{display:none}.side .card{grid-template-columns:100px 1fr}}
</style>
</head>

  </div>

    cat: "বিনোদন",

    body: "দেশের বিনোদন অঙ্গনে এখন উৎসব মুখর পরিবেশ। মানসম্মত চিত্রনাট্য ও নির্মাণশৈলীর কারণে তরুণ দর্শকরা আবারো হলমুখী হচ্ছেন।\n\nএকই সাথে ওটিটি প্ল্যাটফর্মগুলোতেও দেশীয় নির্মাতাদের নতুন নতুন কাজ প্রশংসা কুড়াচ্ছে।",
    by: "বিনোদন ডেস্ক",
    ts: Date.now() - 18000000
  },
  {
    id: "p7",
    title: "বাংলাদেশ ও ঢাকার সমসাময়িক উন্নয়ন চিত্র",
    cat: "বাংলাদেশ",
    img: "https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?w=800&auto=format&fit=crop",
    sum: "রাজধানীর সড়ক ব্যবস্থাপনা ও নগর সুবিধা উন্নত করতে বেশ কিছু নতুন প্রকল্প চালু করা হচ্ছে।",
    body: "যানজট নিরসন ও নাগরিক সেবা সহজ করতে সমন্বিত পরিকল্পনা বাস্তবায়নের উদ্যোগ নেওয়া হয়েছে। পথচারীদের চলাচলের সুবিধার্থে নতুন ফুটওভার ব্রিজ ও ট্রাফিক সিগন্যাল ব্যবস্থার আধুনিকায়ন করা হচ্ছে।\n\nসংক্রান্ত তদারকি কমিটি আশা প্রকাশ করছে খুব শীঘ্রই ঢাকাবাসী এর সুফল পাবেন।",
    by: "বাংলাদেশ ডেস্ক",
    ts: Date.now() - 21600000
  },
  {
    id: "p8",
    title: "বিশ্লেষণ: আগামী দিনের রাজনৈতিক ভাবনা ও তরুণ সমাজ",
    cat: "মতামত",
    img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=800&auto=format&fit=crop",
    sum: "দেশের রাজনীতিতে তরুণ প্রজন্মের সক্রিয়তা ও তাদের ভাবনার জায়গা নিয়ে বিশেষ কলাম।",
    body: "বর্তমান সময়ে তরুণরা শুধু রাজনীতির নিষ্ক্রিয় দর্শক নয়, বরং তারা সংস্কার ও পরিবর্তনের পক্ষে সোচ্চার। স্বচ্ছতা, জবাবদিহিতা এবং মেধার মূল্যায়নই তাদের মূল দাবি।\n\nভবিষ্যতের সমৃদ্ধ বাংলাদেশ গঠনে তরুণদের গঠনমূলক দৃষ্টিভঙ্গি অত্যন্ত গুরুত্বপূর্ণ ভূমিকা পালন করবে।",
    by: "বিশেষ কলামিস্ট",
    ts: Date.now() - 25000000
  }
];

var posts = [];
try {
  var saved = localStorage.getItem('rr_posts_v2');
  if(saved){
    posts = JSON.parse(saved);
  } else {
    posts = defaultPosts;
  }
} catch(e) {
  posts = defaultPosts;
}

if(!posts || !posts.length) {
  posts = defaultPosts;
}

var cur = '';
var editingId = null;
var tempImg = '';
var $=function(i){return document.getElementById(i)};

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmt(ts){try{return new Date(ts).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}}

$('date').textContent = new Date().toLocaleDateString('bn-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

// ড্রপডাউন ক্যাটেগরি নির্বাচন
$('f-cat').innerHTML = CATS.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');

function tabs(){
  var html = '<button data-c="" class="'+(cur===''?'on':'')+'">প্রচ্ছদ</button>';
  html += CATS.map(function(c){
    return '<button data-c="'+esc(c)+'" class="'+(c===cur?'on':'')+'">'+esc(c)+'</button>';
  }).join('');
  $('tabs').innerHTML = html;
}

$('tabs').onclick = function(e){
  var b = e.target.closest('button');
  if(!b) return;
  cur = b.dataset.c;
  location.hash = '';
  tabs();
  render();
};

$('home').onclick = function(){
  cur = '';
  location.hash = '';
  tabs();
  render();
};

function pic(p){
  if(p.img){
    return '<div class="pic"><img src="'+esc(p.img)+'" alt="'+esc(p.title)+'" loading="lazy"></div>';
  }
  return '<div class="pic">R</div>';
}

function card(p, k){
  var lk = 'href="#'+p.id+'"';
  if(k === 'side'){
    return '<a class="card" '+lk+'>'+pic(p)+'<div class="pad"><span class="tag">'+esc(p.cat)+'</span><h3>'+esc(p.title)+'</h3><span class="meta">'+fmt(p.ts)+'</span></div></a>';
  }
  return '<a class="card" '+lk+'>'+pic(p)+'<div class="pad"><span class="tag">'+esc(p.cat)+'</span><h3>'+esc(p.title)+'</h3><p>'+esc((p.sum||'').slice(0,90))+'...</p><span class="meta">'+fmt(p.ts)+'</span></div></a>';
}

function render(){
  var id = location.hash.slice(1);
  var p = id && posts.find(function(x){return x.id === id});

  window.scrollTo(0,0);
  $('tick').textContent = posts.length ? posts.map(function(x){return x.title}).join('   •   ') : 'কোনো খবর নেই';

  // সিঙ্গেল পোস্ট দেখার অংশ
  if(p){
    document.title = p.title + ' | Rajniti Rewrite';
    $('app').innerHTML = '<article class="art">' +
      '<div class="bar">' +
        '<button class="btn alt sm" id="back">← প্রচ্ছদ</button>' +
        '<button class="btn sm" id="btn-edit" style="margin-left:8px;">সম্পাদনা করুন</button>' +
        '<button class="btn alt sm" id="btn-delete" style="margin-left:8px;color:red;border-color:red;">মুছে ফেলুন</button>' +
      '</div>' +
      '<span class="tag">'+esc(p.cat)+'</span>' +
      '<h1>'+esc(p.title)+'</h1>' +
      '<div class="meta">'+esc(p.by||'Rajniti Rewrite ডেস্ক')+' • '+fmt(p.ts)+'</div>' +
      (p.img ? '<img class="main-img" src="'+esc(p.img)+'" alt="'+esc(p.title)+'">' : '') +
      (p.sum ? '<div class="sum">'+esc(p.sum)+'</div>' : '') +
      '<div class="body">'+String(p.body||'').split(/\n+/).map(function(t){return '<p>'+esc(t)+'</p>'}).join('')+'</div>' +
      '</article>';
    
    $('back').onclick = function(){ location.hash = ''; };
    $('btn-edit').onclick = function(){ openForm(p); };
    $('btn-delete').onclick = function(){
      if(confirm('আপনি কি এই খবরটি মুছে ফেলতে চান?')){
        posts = posts.filter(function(x){return x.id !== p.id});
        savePosts();
        location.hash = '';
        render();
      }
    };
    return;
  }

  // প্রচ্ছদ ও ক্যাটেগরি অনুযায়ী খবর দেখানো
  var list = cur ? posts.filter(function(x){return x.cat === cur}) : posts;

  if(!list.length){
    $('app').innerHTML = '<div class="empty"><h2>"'+esc(cur||'প্রচ্ছদ')+'" বিভাগে কোনো খবর পাওয়া যায়নি</h2><p>নতুন খবর লিখতে ওপরে "＋ নতুন খবর লিখুন" বাটনে চাপ দিন।</p></div>';
    return;
  }

  var l = list[0], s = list.slice(1,4), g = list.slice(4);
  var html = '<section class="lead"><a class="card big" href="#'+l.id+'">'+pic(l)+'<div class="pad"><span class="tag">'+esc(l.cat)+'</span><h2>'+esc(l.title)+'</h2><p>'+esc(l.sum)+'</p><span class="meta">'+fmt(l.ts)+'</span></div></a>';
  
  if(s.length > 0){
    html += '<div class="side">'+s.map(function(x){return card(x,'side')}).join('')+'</div>';
  }
  html += '</section>';

  if(g.length > 0){
    html += '<h2 class="sec">আরও খবর</h2><section class="grid">'+g.map(function(x){return card(x)}).join('')+'</section>';
  }

  $('app').innerHTML = html;
}

// লোকাল স্টোরেজে পোস্ট সংরক্ষণ করা
function savePosts(){
  posts.sort(function(a,b){ return b.ts - a.ts; });
  try {
    localStorage.setItem('rr_posts_v2', JSON.stringify(posts));
  } catch(e) {}
}

// ফরম ওপেন করার ফাংশন
function openForm(p){
  editingId = p ? p.id : null;
  $('form-title').textContent = p ? 'খবর সম্পাদনা করুন' : 'নতুন খবর যুক্ত করুন';
  $('f-title').value = p ? p.title : '';
  $('f-cat').value = p ? p.cat : 'বাংলাদেশ';
  $('f-sum').value = p ? p.sum : '';
  $('f-body').value = p ? p.body : '';
  tempImg = p ? (p.img || '') : '';
  $('img-pv').innerHTML = tempImg ? '<img src="'+tempImg+'" class="prev-img">' : '';
  $('f-img').value = '';
  $('adm').className = 'on';
}

// ইমেজ আপলোড প্রিভিউ
$('f-img').onchange = function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    tempImg = evt.target.result;
    $('img-pv').innerHTML = '<img src="'+tempImg+'" class="prev-img">';
  };
  reader.readAsDataURL(file);
};

// সেভ বাটন লজিক
$('btn-save').onclick = function(){
  var title = $('f-title').value.trim();
  var body = $('f-body').value.trim();
  
  if(!title || !body){
    alert('অনুগ্রহ করে শিরোনাম এবং বিস্তারিত খবর লিখুন!');
    return;
  }

  if(editingId){
    var item = posts.find(function(x){return x.id === editingId});
    if(item){
      item.title = title;
      item.cat = $('f-cat').value;
      item.sum = $('f-sum').value.trim();
      item.body = body;
      item.img = tempImg;
    }
  } else {
    var newPost = {
      id: "n" + Date.now(),
      title: title,
      cat: $('f-cat').value,
      sum: $('f-sum').value.trim(),
      body: body,
      img: tempImg,
      by: "Rajniti Rewrite ডেস্ক",
      ts: Date.now()
    };
    posts.unshift(newPost);
  }

  savePosts();
  $('adm').className = '';
  render();
};

$('btn-new').onclick = function(){ openForm(null); };
$('btn-cancel').onclick = function(){ $('adm').className = ''; };

window.onhashchange = render;

// পেজ ইনিশিয়ালাইজ করা
tabs();
render();
</script>
</body>
</html>
